name: CI

# Local technical validation lives in `npm run release:check` (docs/RELEASE.md).
# This workflow runs it plus the clean-install smoke on all three supported
# host platforms, a coverage threshold on Linux, and the orchestration E2E on Linux.
#
# It never publishes, tags or releases anything; permissions are read-only and
# no repository secrets are referenced.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: validate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile-pinned)
        run: npm ci

      - name: Enable unprivileged user namespaces (ubuntu confinement prerequisite)
        if: matrix.os == 'ubuntu-latest'
        run: |
          set -euo pipefail
          # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor.
          # The native helper needs CLONE_NEWUSER to build its confinement
          # namespaces; with the restriction active, unshare() succeeds but
          # mapping the uid is denied ("write uid_map: Operation not permitted").
          # This is a hosted-runner prerequisite, not a Pluton policy toggle: if
          # the capability cannot be enabled and proven, this step fails and the
          # gate below still fails closed.
          restrict=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns 2>/dev/null || echo absent)
          echo "kernel.apparmor_restrict_unprivileged_userns=$restrict"
          if [ "$restrict" = "1" ]; then
            sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          fi
          # Prove the exact capabilities the helper probe and selftest rely on.
          unshare -Ur true
          unshare -Urm true
          unshare -Urn true
          unshare -Urp true
          echo "unprivileged user, mount, network and PID namespaces: available"

      - name: Release gate (typecheck, tests, build, package, audit)
        run: npm run release:check

      - name: Coverage gate (ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: npm run test:coverage

      - name: Package smoke (clean temporary install)
        run: npm run smoke:package

  e2e:
    name: e2e (orchestration + workspaces)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies (lockfile-pinned)
        run: npm ci

      - name: Run orchestration E2E
        run: npm run test:e2e
