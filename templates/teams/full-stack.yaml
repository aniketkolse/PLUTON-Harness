# Pluton full-stack team template — copy into your project with `pluton init`
# or adapt freely: every Ship has its own model, role and permissions.
# Replace model ids with ones from `pluton ship model list <ship>`.
version: 1

project:
  name: __PROJECT_NAME__
  repository: .
  default_branch: __DEFAULT_BRANCH__
  verification: []
  # Add safe, argv-array checks, e.g.:
  #  - name: tests
  #    command: ["npm", "test"]
  #  - name: typecheck
  #    command: ["npm", "run", "typecheck"]

runtime:
  max_concurrent_workers: 3
  max_team_size: 8
  max_delegation_depth: 3
  max_tasks_per_run: 20
  max_run_minutes: 90
  default_task_minutes: 30
  network_policy: open

sandbox:
  kind: native
  native:
    acknowledge_partial_enforcement: true
    acknowledge_host_network: true
    mode: workspace-write
    mode_by_platform:
      darwin: unconfined
      win32: unconfined
    acknowledge_unconfined: true

git:
  require_approval_for_main_branch_integration: true
  protected_paths: []

ships:
  # The Manager is also the default chat Ship, so it uses the same model as
  # the main chat. It may act as a Researcher, Coder, QA or Reviewer itself.
  manager:
    display_name: Manager
    role: supervisor
    engine: opencode
    model: opencode/deepseek-v4.1-flash-free
    instructions_file: .pluton/roles/manager.md
    workspace_policy: coordinator-read-only
    permissions: [project.read, project.write, tests.run, research.report, review.report, verification.report, task.create, task.delegate, task.inspect, task.cancel, task.request_revision, result.collect, diff.inspect, verification.run, approval.request, ship.propose_create, project.status, run.list, run.inspect, run.start, approvals.list, scope.declare, scope.release]
    approval_mode: ask-for-sensitive-actions

  researcher:
    display_name: Researcher - X
    role: researcher
    engine: opencode
    model: opencode/deepseek-v4.1-flash-free
    instructions_file: .pluton/roles/researcher.md
    workspace_policy: read-only
    permissions: [project.read, research.report, diff.inspect]
    approval_mode: ask-for-sensitive-actions

  # Legacy Ship id kept for compatibility; this is the second researcher.
  worker-a:
    display_name: Researcher - Z
    role: researcher
    engine: opencode
    model: opencode/glm-5.3-flash-free
    instructions_file: .pluton/roles/researcher.md
    workspace_policy: read-only
    permissions: [project.read, research.report, diff.inspect]
    approval_mode: ask-for-sensitive-actions

  # Legacy Ship id kept for compatibility; this is the first coder.
  worker-b:
    display_name: Coder - X
    role: coder
    engine: opencode
    model: opencode/glm-5.3-flash-free
    instructions_file: .pluton/roles/worker.md
    workspace_policy: isolated-task-checkout
    permissions: [project.read, project.write, tests.run, diff.inspect, verification.report]

  # Every Ship owns its own model; changing one never rewrites another.
  coder-z:
    display_name: Coder - Z
    role: coder
    engine: opencode
    model: opencode/deepseek-v4.1-flash-free
    instructions_file: .pluton/roles/worker.md
    workspace_policy: isolated-task-checkout
    permissions: [project.read, project.write, tests.run, diff.inspect, verification.report]

  qa:
    display_name: QA
    role: tester
    engine: opencode
    model: opencode/deepseek-v4.1-flash-free
    instructions_file: .pluton/roles/qa.md
    workspace_policy: isolated-task-checkout
    permissions: [project.read, tests.run, diff.inspect, verification.report, verification.run]

  reviewer:
    display_name: Reviewer
    role: reviewer
    engine: opencode
    model: opencode/deepseek-v4.1-flash-free
    instructions_file: .pluton/roles/reviewer.md
    workspace_policy: read-only
    permissions: [project.read, diff.inspect, tests.run, review.report]
    approval_mode: ask-for-sensitive-actions
