# Pluton repository-analysis team template — research-only, read-only access.
version: 1

project:
  name: __PROJECT_NAME__
  repository: .
  default_branch: __DEFAULT_BRANCH__
  verification: []

runtime:
  max_concurrent_workers: 2
  max_team_size: 3
  max_delegation_depth: 1
  max_tasks_per_run: 6
  max_run_minutes: 30
  network_policy: open

sandbox:
  kind: native
  native:
    acknowledge_partial_enforcement: true
    acknowledge_host_network: true
    mode: workspace-write

ships:
  manager:
    display_name: Manager
    role: supervisor
    engine: opencode
    model: opencode/deepseek-v4.1-flash-free
    instructions_file: .pluton/roles/manager.md
    workspace_policy: coordinator-read-only
    permissions: [task.create, task.delegate, task.inspect, result.collect, approval.request, project.status, run.list, run.inspect, run.start, approvals.list]

  researcher:
    display_name: Researcher
    role: researcher
    # Replace the model id with one from `pluton ship model list researcher`.
    engine: opencode
    model: opencode/glm-5.3-flash-free
    instructions_file: .pluton/roles/researcher.md
    workspace_policy: read-only
    permissions: [project.read, research.report, diff.inspect]
