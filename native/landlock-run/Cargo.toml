[package]
name = "landlock-run"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"
description = "Pluton native execution helper: Landlock filesystem policy, user/mount/net/PID namespaces, loopback bridge proxy"

[dependencies]
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
opt-level = "z"
strip = true
